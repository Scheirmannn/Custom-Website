<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-switcher">
        <a href="index.html">Search</a>
        <a href="tv.html" class="active">Tv</a>
    </div>

    <div class="layout">

        <div class="sidebar">

            <div class="card">
                <h3>Swap Button</h3>
                <button class="nav-button" onclick="location.href='index.html'">Shows</button>
            </div>

            <div class="card">
                <h3>Movie ID</h3>
                <input type="text" id="id-input" placeholder="Enter a Movie Name">
            </div>

            <div class="card">
                <h3>Saved Movies</h3>
                <div id="savedShows"></div>
            </div>

        </div>

        <div class="player-section">

            <div class="player-wrap">
                <iframe id="player" src="https://vsembed.su/embed/tv?imdb=tt0491738&season=1&episode=1"
                    allowfullscreen></iframe>
            </div>

            <div class="player-buttons"></div>

        </div>
    </div>

    <script src="scripts/movie.js"></script>

</body>

</html>
