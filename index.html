<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .page {
            max-width: 1400px;
            margin: auto;
            position: relative;
            min-height: calc(100vh - 60px);
        }

        /* =========================
           Navigation
        ========================= */

        .top-buttons {
            position: absolute;
            top: 0;
            right: 0;

            display: flex;
            gap: 12px;
        }

        .top-button {
            width: 70px;
            height: 70px;

            padding: 0;
            border: none;
            border-radius: 50%;

            background: #fff;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);

            font-size: 18px;
            cursor: pointer;

            transition: background .2s, transform .2s;
        }

        .top-button:hover {
            background: #eee;
            transform: translateY(-2px);
        }

        /* =========================
           Main Content
        ========================= */

        .content {
            width: 60%;
            max-width: 900px;

            margin: auto;
            padding-top: 180px;
        }

        .title-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);

            text-align: center;
        }

        .title-card h1 {
            margin: 0;
            font-size: 56px;
            font-weight: 600;
        }

        /* =========================
           Search
        ========================= */

        .search-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);

            margin-top: 20px;
        }

        .search-card h3 {
            margin-top: 0;
            margin-bottom: 16px;

            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .search-card input {
            width: 100%;
            box-sizing: border-box;

            padding: 14px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-family: inherit;
            font-size: 16px;

            outline: none;
        }

        .search-card input:focus {
            border-color: #aaa;
        }

        /* =========================
           Mobile
        ========================= */

        @media(max-width: 900px) {

            body {
                padding: 20px;
            }

            .content {
                width: 100%;
                padding-top: 130px;
            }

            .title-card h1 {
                font-size: 42px;
            }

            .top-button {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Navigation -->
        <div class="top-buttons">

            <button class="top-button" onclick="location.href='movie.html'">
                M
            </button>

            <button class="top-button" onclick="location.href='tv.html'">
                Tv
            </button>

        </div>


        <!-- Main Content -->
        <div class="content">

            <div class="title-card">
                <h1>Diddy Website</h1>
            </div>


            <div class="search-card">

                <h3>Search</h3>

                <input type="text" id="search" placeholder="Enter a Movie or Show">

            </div>

        </div>

    </div>

</body>

</html>
