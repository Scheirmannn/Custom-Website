<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Top-right M / TV buttons */
        .top-buttons {
            position: absolute;
            top: 0;
            right: 55px;
            display: flex;
            gap: 22px;
        }

        .top-button {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 50%;
            background: #d0d0d0;
            font-size: 21px;
            cursor: pointer;
        }

        .top-button:hover {
            background: #bdbdbd;
        }

        /* Main content */
        .content {
            width: 58%;
            margin: 0 auto;
        }

        /* Title */
        h1 {
            margin: 0 0 8px 0;
            text-align: center;
            font-size: 76px;
            font-weight: 700;
        }

        /* Movies / TV navigation */
        .navigation {
            display: flex;
            width: 100%;
            gap: 0;
        }

        .navigation button {
            width: 50%;
            height: 45px;
            border: none;
            background: #cccccc;
            font-size: 21px;
            cursor: pointer;
        }

        .navigation button:first-child {
            border-radius: 15px 15px 15px 15px;
        }

        .navigation button:last-child {
            border-radius: 15px 15px 15px 15px;
        }

        .navigation button:hover {
            background: #bdbdbd;
        }

        /* Search box */
        .search-container {
            margin-top: 4px;
            width: 100%;
            height: 135px;
            background: #d5d5d5;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container input {
            width: 80%;
            height: 55px;
            border: none;
            outline: none;
            background: transparent;
            text-align: center;
            font-size: 21px;
            color: white;
        }

        .search-container input::placeholder {
            color: white;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="top-buttons">

            <button class="top-button" onclick="location.href='movie.html'">
                M
            </button>

            <button class="top-button" onclick="location.href='tv.html'">
                Tv
            </button>

        </div>

        <div class="content">

            <h1>Didly Website</h1>

            <div class="search-container">
                <input type="text" placeholder="Searchhh" id="search">
            </div>

        </div>

    </div>

    <script src="scripts/movie.js"></script>

</body>

</html>
